[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "massif"
dynamic = ["version"]
description = "Fast analysis of massive-scale data produced with MassiveFold"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Nessim Raouraoua" }]
licence = {text = "CeCILL-2.1"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: CEA CNRS Inria Logiciel Libre License, version 2.1 (CeCILL-2.1)",
]

[project.optional-dependencies]
docs = ["sphinx>=7", "sphinx-book-theme", "myst-parser"]

[project.urls]
Documentation = "https://massif.readthedocs.io"
Repository = "https://github.com/NessimRaou/Massif"

[project.scripts]
massif = "massif:run_cli"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
