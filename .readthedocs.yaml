# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "latest"
  jobs:
    # Compile the extension with maturin (debug profile: much faster to build,
    # and enough for autodoc to import the module and read its docstrings).
    install:
      - MATURIN_PEP517_ARGS="--profile dev" pip install ".[docs]"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
